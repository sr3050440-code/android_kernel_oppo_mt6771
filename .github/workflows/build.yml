name: Build OPPO MT6771 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: oppo/mt6771_r_11
          fetch-depth: 1

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc \
            g++ \
            git \
            cpio \
            rsync \
            unzip \
            zip \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # ============================================================
      # ULTIMATE KCONFIG FIX (PERMANENT SOLUTION)
      # ============================================================
      - name: Permanently Erase Missing Oplus/Oppo/Os_track Dependencies
        run: |
          echo "======================================"
          echo "CLEANING UP BROKEN KCONFIG INCLUDES"
          echo "======================================"
          
          # Remove any include or source lines pointing to missing os_track or oppo configs across all Kconfig files
          find . -name "Kconfig*" | while read -r kfile; do
            sed -i '/os_track/d' "$kfile"
            sed -i '/oppo_healthinfo/d' "$kfile"
            sed -i '/foreground_io_opt/d' "$kfile"
          done

          # Specifically fix mm/Kconfig if it contains broken references
          if [ -f "mm/Kconfig" ]; then
            sed -i '/os_track/d' "mm/Kconfig"
            sed -i '/oppo/d' "mm/Kconfig"
          fi

          echo "Broken dependencies successfully wiped out!"

      # ============================================================
      # CREATE OUTPUT DIRECTORY
      # ============================================================
      - name: Prepare Build Directory
        run: |
          rm -rf out
          mkdir -p out

      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================
      - name: Configure Kernel
        run: |
          echo "======================================"
          echo "CONFIGURING OPPO6771 KERNEL"
          echo "======================================"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            oppo6771_defconfig

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        run: |
          echo "======================================"
          echo "BUILDING KERNEL"
          echo "======================================"

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu-

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare Kernel Artifact
        run: |
          echo "======================================"
          echo "PREPARING ARTIFACT"
          echo "======================================"

          rm -rf kernel-output
          mkdir -p kernel-output

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image kernel-output/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb kernel-output/Image.gz-dtb
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz kernel-output/Image.gz
          fi

          find out/arch/arm64/boot -type f -name "*.dtb" -exec cp {} kernel-output/ \; 2>/dev/null || true

          ls -lah kernel-output

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: oppo-mt6771-kernel
          path: kernel-output/
          if-no-files-found: error
