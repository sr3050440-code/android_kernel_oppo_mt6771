name: Build OPPO MT6771 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: oppo/mt6771_r_11
          fetch-depth: 1

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc \
            g++ \
            git \
            cpio \
            rsync \
            unzip \
            zip \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # ============================================================
      # SHOW SOURCE INFORMATION
      # ============================================================
      - name: Show Kernel Information
        run: |
          echo "======================================"
          echo "OPPO MT6771 KERNEL BUILD"
          echo "======================================"

          echo ""
          echo "Git commit:"
          git log -1 --oneline

          echo ""
          echo "Kernel version:"
          make kernelversion || true

          echo ""
          echo "Architecture:"
          ls -la arch/arm64

      # ============================================================
      # CHECK DEFCONFIG
      # ============================================================
      - name: Check MT6771 Defconfig
        run: |
          echo "======================================"
          echo "AVAILABLE OPPO6771 DEFCONFIGS"
          echo "======================================"

          ls arch/arm64/configs | grep -i "oppo6771" || true

      # ============================================================
      # PERMANENT FIX: DISABLE ALL MISSING OPPO/OPLUS KCONFIG SOURCES
      # ============================================================
      - name: Permanently Fix Missing Kconfig Sources
        run: |
          echo "======================================"
          echo "REMOVING MISSING OPPO KCONFIG DEPENDENCIES"
          echo "======================================"
          
          # Find all Kconfig files and comment out lines sourcing non-existent paths containing oppo or oplus
          find . -name "Kconfig*" | while read -r kfile; do
            # Comment out source lines that point to missing oppo/oplus directories
            sed -i '/source.*oppo_/s/^/#/' "$kfile"
            sed -i '/source.*oplus_/s/^/#/' "$kfile"
          done
          
          # Specifically target common problematic Kconfig includes
          for file in mm/Kconfig drivers/Kconfig block/Kconfig arch/arm64/Kconfig; do
            if [ -f "$file" ]; then
              sed -i '/oppo_/s/^/#/' "$file"
              sed -i '/oplus_/s/^/#/' "$file"
            fi
          done
          
          echo "All missing OPPO/OPLUS Kconfig dependencies disabled permanently."

      # ============================================================
      # CREATE OUTPUT DIRECTORY
      # ============================================================
      - name: Prepare Build Directory
        run: |
          rm -rf out
          mkdir -p out

      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================
      - name: Configure Kernel
        run: |
          echo "======================================"
          echo "CONFIGURING OPPO6771 KERNEL"
          echo "======================================"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            oppo6771_defconfig

      # ============================================================
      # SHOW GENERATED CONFIG
      # ============================================================
      - name: Show Kernel Config
        run: |
          echo "======================================"
          echo "CONFIGURATION SUCCESSFUL"
          echo "======================================"

          test -f out/.config

          echo ""
          echo "Kernel config size:"
          wc -l out/.config

          echo ""
          echo "Important configuration:"
          grep -E \
            'CONFIG_ARM64=|CONFIG_ARCH_MEDIATEK=|CONFIG_MTK' \
            out/.config | head -50 || true

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        run: |
          echo "======================================"
          echo "BUILDING KERNEL"
          echo "======================================"

          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu-

      # ============================================================
      # FIND KERNEL OUTPUT
      # ============================================================
      - name: Find Kernel Image
        run: |
          echo "======================================"
          echo "KERNEL OUTPUT FILES"
          echo "======================================"

          echo ""
          echo "All boot files:"

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -print | sort

          echo ""
          echo "Kernel images:"

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "Image.gz-dtb" \
              -o -name "zImage" \
            \) \
            -print || true

          echo ""
          echo "DTB files:"

          find out/arch/arm64/boot \
            -type f \
            -name "*.dtb" \
            -print || true

      # ============================================================
      # PREPARE ARTIFACT
      # ============================================================
      - name: Prepare Kernel Artifact
        run: |
          echo "======================================"
          echo "PREPARING ARTIFACT"
          echo "======================================"

          rm -rf kernel-output
          mkdir -p kernel-output

          # Kernel config
          cp out/.config \
            kernel-output/.config

          # Standard kernel images
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image \
              kernel-output/Image
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz \
              kernel-output/Image.gz
          fi

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb \
              kernel-output/Image.gz-dtb
          fi

          # DTB files
          find out/arch/arm64/boot \
            -type f \
            -name "*.dtb" \
            -exec cp {} kernel-output/ \; \
            2>/dev/null || true

          echo ""
          echo "======================================"
          echo "FINAL ARTIFACT FILES"
          echo "======================================"

          ls -lah kernel-output

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: oppo-mt6771-kernel
          path: kernel-output/
          if-no-files-found: error

      # ============================================================
      # CLEANUP
      # ============================================================
      - name: Post Build Information
        if: always()
        run: |
          echo "======================================"
          echo "BUILD FINISHED"
          echo "======================================"

          echo ""
          echo "Git commit:"
          git log -1 --oneline

          echo ""
          echo "Build directory:"
          du -sh out 2>/dev/null || true

          echo ""
          echo "Artifact directory:"
          du -sh kernel-output 2>/dev/null || true
