name: Build OPPO MT6771 Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MT6771 Kernel
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # SHOW SOURCE
      # ============================================================
      - name: Show Source Information
        shell: bash
        run: |
          echo "======================================"
          echo " Repository : $GITHUB_REPOSITORY"
          echo " Ref        : $GITHUB_REF"
          echo " Commit     : $GITHUB_SHA"
          echo "======================================"

          echo
          echo "Kernel version:"
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile || true

      # ============================================================
      # INSTALL DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++ \
            gcc \
            git \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            libssl-dev \
            make \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # CHECK REQUIRED FILES
      # ============================================================
      - name: Check Kernel Tree
        shell: bash
        run: |
          set -e

          echo "Checking kernel source..."

          test -f Makefile
          test -d arch
          test -d drivers
          test -d include
          test -d scripts

          echo "Kernel source OK."

          echo
          echo "Checking ARM64 architecture..."
          test -d arch/arm64

          echo
          echo "Checking defconfig..."
          test -f arch/arm64/configs/oppo6771_defconfig

          echo
          echo "oppo6771_defconfig FOUND."

      # ============================================================
      # SETUP ARM64 GCC TOOLCHAIN
      # ============================================================
      - name: Setup ARM64 Toolchain
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/toolchains"

          echo "Cloning AArch64 GCC toolchain..."

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            "$HOME/toolchains/aarch64"

          echo "Cloning ARM 32-bit GCC toolchain..."

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git \
            "$HOME/toolchains/arm"

          echo "$HOME/toolchains/aarch64/bin" >> "$GITHUB_PATH"
          echo "$HOME/toolchains/arm/bin" >> "$GITHUB_PATH"

          echo
          echo "AArch64 compiler:"
          "$HOME/toolchains/aarch64/bin/aarch64-linux-android-gcc" --version | head -n 1

          echo
          echo "ARM compiler:"
          "$HOME/toolchains/arm/bin/arm-linux-androideabi-gcc" --version | head -n 1

      # ============================================================
      # CLEAN BUILD DIRECTORY
      # ============================================================
      - name: Prepare Build Directory
        shell: bash
        run: |
          set -e

          rm -rf out
          mkdir -p out

          echo "Output directory prepared."

      # ============================================================
      # CONFIGURE KERNEL
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$HOME/toolchains/aarch64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$HOME/toolchains/arm/bin/arm-linux-androideabi-"

          echo "======================================"
          echo "Kernel configuration"
          echo "DEFCONFIG: oppo6771_defconfig"
          echo "ARCH:      arm64"
          echo "======================================"

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            oppo6771_defconfig

          test -f out/.config

          echo
          echo "Kernel configuration generated successfully."

      # ============================================================
      # DISPLAY IMPORTANT CONFIG
      # ============================================================
      - name: Check Final Configuration
        shell: bash
        run: |
          set -e

          echo "Checking generated .config..."

          test -s out/.config

          echo
          echo "Architecture:"
          grep '^CONFIG_ARCH_' out/.config | head -20 || true

          echo
          echo "ARM64:"
          grep '^CONFIG_ARM64=' out/.config || true

          echo
          echo "Build configuration is ready."

      # ============================================================
      # BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        shell: bash
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export CROSS_COMPILE="$HOME/toolchains/aarch64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$HOME/toolchains/arm/bin/arm-linux-androideabi-"

          echo "======================================"
          echo "Starting kernel build"
          echo "CPU cores: $(nproc)"
          echo "======================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32"

      # ============================================================
      # FIND KERNEL IMAGE
      # ============================================================
      - name: Find Kernel Image
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Kernel output files"
          echo "======================================"

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            2>/dev/null || true

          echo
          echo "Checking kernel image..."

          FOUND=0

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "FOUND: Image.gz-dtb"
            FOUND=1
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "FOUND: Image.gz"
            FOUND=1
          fi

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "FOUND: Image"
            FOUND=1
          fi

          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No kernel Image was generated."
            exit 1
          fi

      # ============================================================
      # COLLECT BUILD OUTPUT
      # ============================================================
      - name: Collect Kernel Output
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          # Kernel images
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image release/
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz release/
          fi

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb release/
          fi

          # DTB
          if [ -d out/arch/arm64/boot/dts ]; then
            mkdir -p release/dts

            find out/arch/arm64/boot/dts \
              -type f \
              \( -name '*.dtb' -o -name '*.dtbo' \) \
              -exec cp {} release/dts/ \; \
              2>/dev/null || true
          fi

          # Modules
          mkdir -p release/modules

          find out \
            -type f \
            -name '*.ko' \
            -exec cp {} release/modules/ \; \
            2>/dev/null || true

          # Configuration
          cp out/.config release/kernel.config

          echo "======================================"
          echo "Release files"
          echo "======================================"

          find release \
            -type f \
            -printf '%p\n' \
            | sort

      # ============================================================
      # SAVE BUILD LOG INFORMATION
      # ============================================================
      - name: Build Information
        shell: bash
        run: |
          set -e

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo "Commit: $GITHUB_SHA"
            echo "Defconfig: oppo6771_defconfig"
            echo "Architecture: arm64"
            echo
            echo "Kernel:"
            grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile || true
            echo
            echo "Compiler:"
            "$HOME/toolchains/aarch64/bin/aarch64-linux-android-gcc" --version | head -n 1
          } > release/build-info.txt

          cat release/build-info.txt

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPPO-MT6771-Kernel
          path: release/
          if-no-files-found: error
          retention-days: 7
