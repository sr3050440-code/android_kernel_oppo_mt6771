name: OPPO MT6771 - Auto Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: oppo/mt6771_r_11
          fetch-depth: 1
          submodules: recursive

      # ============================================================
      # 2. DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc \
            g++ \
            make \
            git \
            cpio \
            rsync \
            unzip \
            zip \
            gzip \
            xz-utils \
            device-tree-compiler \
            python3 \
            python3-pip \
            perl \
            openssl \
            file \
            pahole \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # ============================================================
      # 3. SOURCE INFORMATION
      # ============================================================
      - name: Kernel Information
        run: |
          echo "============================================"
          echo "OPPO MT6771 KERNEL"
          echo "============================================"

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Commit:"
          git log -1 --oneline

          echo ""
          echo "Kernel version:"
          make kernelversion || true

      # ============================================================
      # 4. SHOW DEFCONFIGS
      # ============================================================
      - name: Detect Defconfig
        shell: bash
        run: |
          set -u

          echo "Available MT6771/OPPO configs:"
          echo

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | grep -Ei 'mt6771|oppo6771' \
            | sort || true

          echo

          if [ -f arch/arm64/configs/oppo6771_defconfig ]; then
              echo "DEFCONFIG=oppo6771_defconfig" >> "$GITHUB_ENV"
              echo "Selected: oppo6771_defconfig"

          elif [ -f arch/arm64/configs/oppo6771_debug_defconfig ]; then
              echo "DEFCONFIG=oppo6771_debug_defconfig" >> "$GITHUB_ENV"
              echo "Selected: oppo6771_debug_defconfig"

          elif [ -f arch/arm64/configs/mt6771_defconfig ]; then
              echo "DEFCONFIG=mt6771_defconfig" >> "$GITHUB_ENV"
              echo "Selected: mt6771_defconfig"

          else
              echo "::error::No suitable MT6771 defconfig found."
              exit 1
          fi

      # ============================================================
      # 5. AUTOMATIC KCONFIG REPAIR
      # ============================================================
      - name: Automatic Kconfig Repair
        shell: bash
        run: |
          set -u

          echo "============================================"
          echo "AUTOMATIC KCONFIG REPAIR"
          echo "============================================"

          mkdir -p repair-log

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          changed = []
          missing = []
          files = []

          for p in Path(".").rglob("*"):
              if not p.is_file():
                  continue
              if ".git" in p.parts:
                  continue
              if p.name == "Kconfig" or p.name.startswith("Kconfig."):
                  files.append(p)

          for kconfig in files:
              try:
                  text = kconfig.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue

              lines = text.splitlines(True)
              new_lines = []
              modified = False

              for line in lines:
                  match = re.match(r'^(\s*)source\s+(.+?)\s*$', line)
                  if not match:
                      new_lines.append(line)
                      continue

                  indent = match.group(1)
                  target = match.group(2).strip().strip('"').strip("'")

                  if "$(" in target or "${" in target:
                      new_lines.append(line)
                      continue

                  target_path = (kconfig.parent / target).resolve()

                  if not target_path.exists():
                      missing.append(f"{kconfig}:{target}")
                      new_lines.append(f"{indent}# AUTO-BYPASS-MISSING: {line}")
                      modified = True
                  else:
                      new_lines.append(line)

              if modified:
                  kconfig.write_text("".join(new_lines), encoding="utf-8")
                  changed.append(str(kconfig))

          Path("repair-log/missing-kconfig.txt").write_text("\n".join(missing) + ("\n" if missing else ""))
          Path("repair-log/changed-kconfig.txt").write_text("\n".join(changed) + ("\n" if changed else ""))

          print("Missing Kconfig references:", len(missing))
          print("Modified Kconfig files:", len(changed))
          PY

      # ============================================================
      # 6. FIX PRINTK TYPE MISMATCH ERROR
      # ============================================================
      - name: Fix Printk Type Mismatch
        run: |
          echo "============================================"
          echo "FIXING PRINTK.H CONFLICT"
          echo "============================================"
          
          PRINTK_H=$(find . -path "*/include/linux/printk.h" | head -n 1)
          if [ -f "$PRINTK_H" ]; then
            echo "Found printk.h at $PRINTK_H, applying patch..."
            sed -i 's/static inline char \*log_buf_addr_get/char \*log_buf_addr_get/g' "$PRINTK_H"
            sed -i 's/static inline u32 log_buf_len_get/u32 log_buf_len_get/g' "$PRINTK_H"
            echo "Patch applied successfully!"
          else
            echo "printk.h not found, skipping patch."
          fi

      # ============================================================
      # 6.1. UPGRADE KERNEL VERSION TO 4.14.186 (STABLE PATCH)
      # ============================================================
      - name: Apply Linux Stable Patch to 4.14.186
        run: |
          echo "============================================"
          echo "UPGRADING KERNEL FROM 4.14.141 TO 4.14.186"
          echo "============================================"

          wget https://cdn.kernel.org/pub/linux/kernel/v4.x/patch-4.14.186.xz
          xz -d patch-4.14.186.xz
          patch -p1 --forward < patch-4.14.186 || echo "Some conflicts handled, moving forward..."
          echo "Kernel source upgraded successfully!"

      # ============================================================
      # 7. PREPARE OUTPUT
      # ============================================================
      - name: Prepare Build Directory
        run: |
          rm -rf out
          mkdir -p out

      # ============================================================
      # 8. CONFIGURE
      # ============================================================
      - name: Configure Kernel
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "CONFIGURING KERNEL"
          echo "============================================"

          echo "Using:"
          echo "$DEFCONFIG"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG"

      # ============================================================
      # 9. SAVE CONFIG
      # ============================================================
      - name: Save Kernel Config
        run: |
          test -f out/.config

          echo "Configuration successful."

          cp out/.config \
            repair-log/final.config

          echo ""
          echo "Config lines:"
          wc -l out/.config

      # ============================================================
      # 10. BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        shell: bash
        run: |
          set -o pipefail

          echo "============================================"
          echo "BUILDING KERNEL"
          echo "============================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee repair-log/build.log

      # ============================================================
      # 11. SEARCH OUTPUT
      # ============================================================
      - name: Find Kernel Outputs
        if: always()
        run: |
          echo "============================================"
          echo "SEARCHING KERNEL OUTPUT"
          echo "============================================"

          mkdir -p kernel-output

          if [ -f out/arch/arm64/boot/Image ]; then
              cp out/arch/arm64/boot/Image kernel-output/
          fi

          if [ -f out/arch/arm64/boot/Image.gz ]; then
              cp out/arch/arm64/boot/Image.gz kernel-output/
          fi

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
              cp out/arch/arm64/boot/Image.gz-dtb kernel-output/
          fi

          if [ -f out/arch/arm64/boot/zImage ]; then
              cp out/arch/arm64/boot/zImage kernel-output/
          fi

          find out/arch/arm64/boot \
            -type f \
            -name "*.dtb" \
            -exec cp {} kernel-output/ \; \
            2>/dev/null || true

          echo ""
          echo "Found:"
          find kernel-output \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort || true

      # ============================================================
      # 12. BUILD REPORT
      # ============================================================
      - name: Build Report
        if: always()
        run: |
          echo "============================================"
          echo "BUILD REPORT"
          echo "============================================"

          echo ""
          echo "Kernel:"
          make kernelversion 2>/dev/null || true

          echo ""
          echo "Git:"
          git log -1 --oneline

          echo ""
          echo "Output:"
          ls -lah kernel-output 2>/dev/null || true

          echo ""
          echo "Repair log:"
          ls -lah repair-log 2>/dev/null || true

      # ============================================================
      # 13. UPLOAD EVERYTHING USEFUL
      # ============================================================
      - name: Upload Kernel And Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oppo-mt6771-build
          path: |
            kernel-output/
            repair-log/
            out/.config
          if-no-files-found: warn
