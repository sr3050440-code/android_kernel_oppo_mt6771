name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT CODE
      # ============================================================
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ============================================================
      # 2. SETUP ENVIRONMENT & DEPENDENCIES
      # ============================================================
      - name: Set Up Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev \
            libncursesw5-dev libelf-dev clang lld llvm libpython3-dev python3-pip zip unzip curl

      # ============================================================
      # 3. SET UP TOOLCHAIN (CLANG / GCC)
      # ============================================================
      - name: Download & Set Up Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          # Azure Proton Clang download
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang
          echo "$GITHUB_WORKSPACE/toolchain/clang/bin" >> $GITHUB_PATH

      # ============================================================
      # 4. DOWNLOAD KERNEL SOURCE
      # ============================================================
      - name: Download Kernel Source
        run: |
          # Replace with your target kernel repo link if cloning externally,
          # or skip if source is in root repository.
          echo "Kernel source ready."

      # ============================================================
      # 5. GENERATE DEFAULT CONFIG (DEFCONFIG)
      # ============================================================
      - name: Configure Defconfig
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          # Replace 'vendor/fleur_user_defconfig' with your defconfig filename if needed
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- fleur_user_defconfig || \
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- defconfig

      # ============================================================
      # 6. FORCE FIX CPUTYPE.H REDEFINITION ERROR
      # ============================================================
      - name: Fix cpuType.h Redefinition Conflict
        run: |
          echo "============================================"
          echo "APPLYING FORCE FIX FOR CPUTYPE.H CONFLICTS"
          echo "============================================"

          # Redefinition रोकने के लिए struct midr_range और सम्बंधित फ़ंक्शंस को ग्लोबल रीनेम करें
          find arch/arm64/ -type f \( -name "*.h" -o -name "*.c" \) -exec sed -i 's/struct midr_range {/struct midr_range_bkp {/g' {} +
          find arch/arm64/ -type f \( -name "*.h" -o -name "*.c" \) -exec sed -i 's/struct midr_range /struct midr_range_bkp /g' {} +
          find arch/arm64/ -type f \( -name "*.h" -o -name "*.c" \) -exec sed -i 's/is_midr_in_range/is_midr_in_range_bkp/g' {} +
          
          find include/ -type f \( -name "*.h" -o -name "*.c" \) -exec sed -i 's/struct midr_range {/struct midr_range_bkp {/g' {} + 2>/dev/null || true
          find include/ -type f \( -name "*.h" -o -name "*.c" \) -exec sed -i 's/struct midr_range /struct midr_range_bkp /g' {} + 2>/dev/null || true
          find include/ -type f \( -name "*.h" -o -name "*.c" \) -exec sed -i 's/is_midr_in_range/is_midr_in_range_bkp/g' {} + 2>/dev/null || true

          echo "Force patch applied successfully!"

      # ============================================================
      # 7. BUILD KERNEL
      # ============================================================
      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi-

      # ============================================================
      # 8. UPLOAD KERNEL OUTPUTS
      # ============================================================
      - name: Find Kernel Outputs
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Kernel Image found!"
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Kernel Image found!"
          fi

      # ============================================================
      # 9. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload Kernel And Logs
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-Output
          path: |
            out/arch/arm64/boot/Image*
            out/arch/arm64/boot/dtbo.img
