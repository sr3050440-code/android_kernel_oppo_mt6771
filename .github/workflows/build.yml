name: Build OPPO MT6771 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: oppo/mt6771_r_11
          fetch-depth: 1

      # ==========================================
      # DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            make \
            gcc \
            g++ \
            git \
            cpio \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      # ==========================================
      # KERNEL INFORMATION
      # ==========================================
      - name: Show Kernel Information
        run: |
          echo "Kernel source:"
          git log -1 --oneline
          echo
          echo "Kernel version:"
          make kernelversion || true
          echo
          echo "Architecture:"
          ls arch/arm64

      # ==========================================
      # CHECK DEFCONFIG
      # ==========================================
      - name: Check OPPO MT6771 Defconfig
        run: |
          echo "Checking available OPPO defconfigs..."
          ls arch/arm64/configs | grep -i "oppo6771"

      # ==========================================
      # CONFIGURE KERNEL
      # ==========================================
      - name: Configure Kernel
        run: |
          mkdir -p out

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            oppo6771_defconfig

      # ==========================================
      # SHOW CONFIG
      # ==========================================
      - name: Show Kernel Config
        run: |
          echo "CONFIGURATION SUCCESSFUL"

          grep -E \
            'CONFIG_ARCH_MEDIATEK|CONFIG_MACH_MT6771|CONFIG_ARM64' \
            out/.config || true

      # ==========================================
      # BUILD KERNEL
      # ==========================================
      - name: Build Kernel
        run: |
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu-

      # ==========================================
      # FIND KERNEL IMAGE
      # ==========================================
      - name: Find Kernel Image
        run: |
          echo "===== Kernel outputs ====="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( -name "Image" \
            -o -name "Image.gz" \
            -o -name "Image.gz-dtb" \
            -o -name "*.dtb" \
            \) \
            -print || true

      # ==========================================
      # PACKAGE
      # ==========================================
      - name: Prepare Kernel Artifact
        run: |
          mkdir -p kernel-output

          cp out/.config kernel-output/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image kernel-output/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz kernel-output/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz-dtb kernel-output/ 2>/dev/null || true

          find out/arch/arm64/boot \
            -name "*.dtb" \
            -exec cp {} kernel-output/ \; 2>/dev/null || true

          echo "===== Final files ====="
          ls -lah kernel-output

      # ==========================================
      # UPLOAD
      # ==========================================
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: oppo-mt6771-kernel
          path: kernel-output/
          if-no-files-found: error
