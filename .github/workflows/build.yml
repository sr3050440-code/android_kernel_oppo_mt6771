name: Build MT6771 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================
      # CHECKOUT
      # ============================================
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ============================================
      # DEPENDENCIES
      # ============================================
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            git \
            curl \
            zip \
            unzip \
            libssl-dev \
            libelf-dev \
            cpio \
            rsync \
            python3


      # ============================================
      # SHOW SOURCE INFORMATION
      # ============================================
      - name: Show Kernel Information
        run: |
          echo "======================================"
          echo "MT6771 KERNEL"
          echo "======================================"

          echo
          echo "Kernel version:"
          make kernelversion || true

          echo
          echo "Current commit:"
          git log -1 --oneline

          echo
          echo "Architecture:"
          grep -E '^CONFIG_ARCH_MT' arch/arm64/configs/* 2>/dev/null || true


      # ============================================
      # FIND DEFCONFIGS
      # ============================================
      - name: Find MT6771 Defconfig
        run: |
          echo "======================================"
          echo "AVAILABLE DEFCONFIGS"
          echo "======================================"

          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            | sort

          echo
          echo "MT6771 related configs:"
          find arch/arm64/configs \
            -maxdepth 1 \
            -type f \
            | grep -Ei 'mt6771|oppo|reno|r11|a3|f7|ax5' \
            || true


      # ============================================
      # AUTOMATICALLY SELECT DEFCONFIG
      # ============================================
      - name: Select Defconfig
        run: |
          set -e

          CONFIG=""

          for name in \
            mt6771_defconfig \
            oppo_mt6771_defconfig \
            oppo_defconfig \
            mt6771_r_11_defconfig \
            mt6771_r11_defconfig
          do
            if [ -f "arch/arm64/configs/$name" ]; then
              CONFIG="$name"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo
            echo "ERROR: No known MT6771 defconfig found."
            echo
            echo "Available configs:"
            ls arch/arm64/configs
            exit 1
          fi

          echo "Using defconfig: $CONFIG"

          echo "DEFCONFIG=$CONFIG" >> "$GITHUB_ENV"


      # ============================================
      # CONFIGURE KERNEL
      # ============================================
      - name: Configure Kernel
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURING KERNEL"
          echo "======================================"

          echo "Defconfig: $DEFCONFIG"

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          echo
          echo "Configuration completed."

          test -f out/.config


      # ============================================
      # INSTALL CROSS COMPILER
      # ============================================
      - name: Install AArch64 Compiler
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu


      # ============================================
      # BUILD KERNEL
      # ============================================
      - name: Build Kernel
        run: |
          set -e

          echo "======================================"
          echo "BUILDING MT6771 KERNEL"
          echo "======================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KCFLAGS="-Wno-error"

      # ============================================
      # SHOW BUILD OUTPUT
      # ============================================
      - name: Find Kernel Image
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort


      # ============================================
      # UPLOAD KERNEL
      # ============================================
      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: MT6771-kernel
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
          if-no-files-found: warn
