name: Build MT6771 Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncurses-dev zip unzip libgnutls28-dev clang lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python2 python2.7
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2

      - name: Prepare Source
        run: |
          git config --global core.autocrlf false
          find . -name "*.py" -exec sed -i 's/\r$//' {} + || true

      - name: Setup Cross Compilers
        run: |
          mkdir -p gcc64/bin gcc32/bin
          for x in /usr/bin/aarch64-linux-gnu-*; do
            [ -e "$x" ] && ln -sf "$x" gcc64/bin/
          done
          for x in /usr/bin/arm-linux-gnueabi-*; do
            [ -e "$x" ] && ln -sf "$x" gcc32/bin/
          done
          aarch64-linux-gnu-gcc --version
          arm-linux-gnueabi-gcc --version

      - name: Configure Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export PYTHON=python2.7
          
          # स्क्रीनशॉट में मौजूद सही defconfig का उपयोग किया गया है
          make O=out oppo6771_defconfig
          
          # स्टैक प्रोटेक्टर और डिबग इंफो से जुड़े एरर हटाने के लिए
          sed -i '/^CONFIG_CC_STACKPROTECTOR_STRONG=/d' out/.config || true
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config
          sed -i '/^CONFIG_DEBUG_INFO=/d;/^CONFIG_DEBUG_INFO_DWARF/d' out/.config || true
          echo '# CONFIG_DEBUG_INFO is not set' >> out/.config
          
          make O=out olddefconfig

      - name: Compile Kernel
        shell: bash
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:/usr/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export PYTHON=python2.7
          
          echo "========================================"
          echo "       MT6771 KERNEL BUILD STARTED"
          echo "========================================"
          
          set +e
          make -j"$(nproc)" O=out PYTHON=python2.7 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          
          if [ "$status" -ne 0 ]; then
            echo "========================================"
            echo "          KERNEL BUILD FAILED"
            echo "========================================"
            tail -n 100 build.log
            exit "$status"
          fi
          
          echo "========================================"
          echo "          KERNEL BUILD SUCCESS"
          echo "========================================"

      - name: Collect Kernel
        run: |
          mkdir -p kernel-output
          for f in Image Image.gz Image.gz-dtb Image-dtb Image.lz4 Image.lzma Image.xz; do
            if [ -f "out/arch/arm64/boot/$f" ]; then
              cp "out/arch/arm64/boot/$f" kernel-output/
            fi
          done
          find out/arch/arm64/boot/dts -type f -name "*.dtb" -exec cp {} kernel-output/ \; 2>/dev/null || true
          cp build.log kernel-output/
          ls -lh kernel-output

      - name: Package and Upload
        uses: actions/upload-artifact@v4
        with:
          name: MT6771-Kernel-Output
          path: kernel-output/
